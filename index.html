<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豆瓣电影推荐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #00b389, #009672); color: white; padding: 18px 20px; text-align: center; font-size: 18px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .chat-box { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
    .msg { max-width: 85%; margin-bottom: 16px; padding: 14px 18px; border-radius: 16px; line-height: 1.7; font-size: 15px; }
    .user { background: #00b389; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
    .bot { background: white; margin-right: auto; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-bottom-left-radius: 4px; }
    .bot img { width: 120px; border-radius: 8px; margin-top: 10px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .bot a { color: #00b389; text-decoration: none; }
    .bot a:hover { text-decoration: underline; }
    .input-area { background: white; border-top: 1px solid #e8e8e8; padding: 12px 20px; }
    .input-wrap { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 14px; transition: border-color 0.2s; }
    input:focus { border-color: #00b389; }
    button { padding: 12px 28px; background: #00b389; color: white; border: none; border-radius: 24px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.2s; }
    button:hover { background: #009672; }
  </style>
</head>
<body>
  <div class="header">🎬 豆瓣电影推荐</div>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="说个类型/心情，我给你挑片..." />
      <button onclick="send()">发送</button>
    </div>
  </div>

<script>
const chatBox = document.getElementById('chatBox');
const input = document.getElementById('input');
input.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const loading = addMsg('思考中...', 'bot');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    loading.remove();
    addMsg(data.reply || '出错了', 'bot');
  } catch (e) {
    loading.remove();
    addMsg('网络出错了', 'bot');
  }
}

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  let html = text
    .replace(/!\[.*?\]\((.*?)\)/g, '<img src="$1">')
    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
  div.innerHTML = html;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}
</script>
</body>
</html>
