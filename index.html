<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豆瓣电影推荐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1117;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .wall {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 300px;
      overflow: hidden;
      z-index: 0;
      opacity: 0.45;
    }
    .wall.left { left: 0; }
    .wall.right { right: 0; }

    .wall-track {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 0 14px;
      animation: scrollUp 240s linear infinite;
    }
    .wall.right .wall-track {
      animation: scrollDown 240s linear infinite;
    }
    @keyframes scrollUp {
      from { transform: translateY(0); }
      to { transform: translateY(-50%); }
    }
    @keyframes scrollDown {
      from { transform: translateY(-50%); }
      to { transform: translateY(0); }
    }

    .wall img {
      width: 272px;
      border-radius: 10px;
      flex-shrink: 0;
      display: block;
    }

    .wall::before, .wall::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 120px;
      z-index: 1;
    }
    .wall::before { top: 0; background: linear-gradient(to bottom, #0f1117, transparent); }
    .wall::after { bottom: 0; background: linear-gradient(to top, #0f1117, transparent); }

    .header {
      background: linear-gradient(135deg, #00b389, #00796b);
      color: white;
      padding: 18px;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 3px; }

    .msg {
      max-width: 95%;
      margin-bottom: 18px;
      padding: 18px 22px;
      border-radius: 14px;
      line-height: 1.9;
      font-size: 15px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      background: #00b389;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .bot {
      background: #1a1d27;
      color: #e4e4e7;
      margin-right: auto;
      border-bottom-left-radius: 4px;
      border: 1px solid #2a2d3a;
    }

    .bot img {
      width: 100%;
      max-width: 280px;
      border-radius: 12px;
      margin: 14px auto;
      display: block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .bot a {
      color: #4dd9b8;
      text-decoration: none;
      word-break: break-all;
    }
    .bot a:hover { text-decoration: underline; }

    .input-area {
      background: #1a1d27;
      padding: 14px 20px;
      border-top: 1px solid #2a2d3a;
      position: relative;
      z-index: 10;
    }
    .input-wrap {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 13px 20px;
      border: 1px solid #2a2d3a;
      border-radius: 24px;
      outline: none;
      font-size: 14px;
      background: #252836;
      color: #e4e4e7;
    }
    input::placeholder { color: #6b7280; }
    input:focus {
      border-color: #00b389;
      background: #1a1d27;
    }
    button {
      padding: 13px 28px;
      background: #00b389;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    button:hover { background: #009672; }

    .typing {
      display: inline-flex;
      gap: 5px;
    }
    .typing span {
      width: 8px;
      height: 8px;
      background: #00b389;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 1400px) {
      .wall { width: 220px; }
      .wall img { width: 192px; }
    }
    @media (max-width: 1100px) {
      .wall { width: 160px; }
      .wall img { width: 132px; }
    }
    @media (max-width: 800px) {
      .wall { display: none; }
    }
  </style>
</head>
<body>

  <div class="wall left">
    <div class="wall-track" id="wallLeft"></div>
  </div>
  <div class="wall right">
    <div class="wall-track" id="wallRight"></div>
  </div>

  <div class="header">
    <h1>🎬 豆瓣电影推荐</h1>
    <p>250部经典，帮你挑最好的那一部</p>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="说个类型/心情/年代，我给你挑片..." />
      <button onclick="send()">发送</button>
    </div>
  </div>

<script>
const posterBase = 'https://laotsqnrm.github.io/movie-posters/';
function buildWall(el, start, end) {
  let html = '';
  for (let round = 0; round < 2; round++) {
    for (let i = start; i <= end; i++) {
      const num = String(i).padStart(3, '0');
      html += `<img src="${posterBase}${num}.png">`;
    }
  }
  el.innerHTML = html;
}
buildWall(document.getElementById('wallLeft'), 1, 50);
buildWall(document.getElementById('wallRight'), 201, 250);

const chatBox = document.getElementById('chatBox');
const input = document.getElementById('input');
input.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });

// 渲染文本为 HTML
function renderHtml(text) {
  const imgs = [];
  let html = text.replace(/!\[.*?\]\((.*?)\)/g, (m, url) => {
    imgs.push(url);
    return '__IMG_' + (imgs.length - 1) + '__';
  });
  html = html.replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank">$1</a>');
  html = html.replace(/__IMG_(\d+)__/g, (m, i) => '<img src="' + imgs[i] + '">');
  html = html.replace(/\n/g, '<br>');
  return html;
}

// 打字机效果
async function typeMessage(div, fullText) {
  let i = 0;
  const speed = 15; // 每字间隔毫秒
  while (i < fullText.length) {
    i += 2; // 每次加2个字，速度快点
    div.innerHTML = renderHtml(fullText.slice(0, i));
    chatBox.scrollTop = chatBox.scrollHeight;
    await new Promise(r => setTimeout(r, speed));
  }
  div.innerHTML = renderHtml(fullText);
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';

  const loading = document.createElement('div');
  loading.className = 'msg bot';
  loading.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chatBox.appendChild(loading);
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    loading.remove();
    
    const reply = data.reply || '出错了';
    const div = document.createElement('div');
    div.className = 'msg bot';
    chatBox.appendChild(div);
    await typeMessage(div, reply);
  } catch (e) {
    loading.remove();
    addMsg('网络出错了', 'bot');
  }
}

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = renderHtml(text);
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}
</script>
</body>
</html>
