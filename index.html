<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豆瓣电影推荐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #00b389; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: bold; }
    .chat-box { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { max-width: 80%; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
    .user { background: #00b389; color: white; margin-left: auto; }
    .bot { background: white; margin-right: auto; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .bot img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    .input-area { display: flex; padding: 12px; background: white; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 14px; }
    button { margin-left: 8px; padding: 10px 20px; background: #00b389; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">🎬 豆瓣电影推荐</div>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="说个类型/心情，我给你挑片..." />
    <button onclick="send()">发送</button>
  </div>
<script>
const chatBox = document.getElementById('chatBox');
const input = document.getElementById('input');
input.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const loading = addMsg('思考中...', 'bot');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    loading.remove();
    addMsg(data.reply || '出错了', 'bot');
  } catch (e) {
    loading.remove();
    addMsg('网络出错了', 'bot');
  }
}
function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = text.replace(/!\[.*?\]\((.*?)\)/g, '<img src="$1" style="max-width:100%;border-radius:8px;margin-top:8px">');
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

</script>
</body>
</html>
